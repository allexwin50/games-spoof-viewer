name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar plataforma e build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK de debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AppsSpoof-v1.0.apk

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: games-spoof-viewer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar Release (quando a mensagem do commit tiver [release])
        if: contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Apps Spoof v1.0
          files: AppsSpoof-v1.0.apk
          body: |
            **Apps Spoof v1.0**

            Visualizador que aparece em **Configurações › Apps** e mostra o mapa
            app → perfil lido de `/product/etc/assets/games_spoof.prop`.

            - Tema seguindo o aparelho: claro (branco, com destaque Monet) e escuro (preto total)
            - Cards arredondados, nomes de perfil legíveis (`Nome - Spoofs: N`)
            - 38 idiomas (inglês de base + português e mais 36)

            O APK é assinado com a chave de **debug**. Para a entrada aparecer no
            Ajustes, instale como **app de sistema** (ex.: `/product/app/`, perm. 644)
            e reinicie. Também abre por atalho via intent VIEW.
